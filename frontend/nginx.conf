server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA : toutes les routes non-fichiers renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API vers le backend (évite les soucis CORS en prod)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy WebSocket pour le dashboard temps réel
    location /api/dashboard/ws {
        proxy_pass http://backend:8000/dashboard/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
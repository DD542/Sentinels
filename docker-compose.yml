services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Ces valeurs viennent du fichier .env à la racine (voir .env.example)
      - database_url=${DATABASE_URL:-}
      - vault_master_key=${VAULT_MASTER_KEY}
      - audit_hmac_key=${AUDIT_HMAC_KEY}
      - admin_token=${ADMIN_TOKEN:-}
      - dashboard_token=${DASHBOARD_TOKEN:-}
      - rate_limit_per_minute=${RATE_LIMIT_PER_MINUTE:-120}
      - ollama_base_url=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # La console passe par le proxy nginx (meme origine) : CORS inutile
      # ici. A renseigner si vous exposez l'API sur un autre domaine.
      - cors_origins=${CORS_ORIGINS:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      # L'image non privilegiee ecoute sur 8080 (un port < 1024 exigerait
      # des capacites root).
      - "8080:8080"
    environment:
      - SENTINEL_API_UPSTREAM=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
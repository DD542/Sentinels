# Valeurs par défaut de SENTINEL.
# Les défauts visent la PRODUCTION : mode strict actif, secrets externes,
# conteneur non-root en système de fichiers en lecture seule.

replicaCount: 2

image:
  repository: ghcr.io/dd542/sentinel
  tag: ""                     # vide = appVersion du Chart
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8000

# ---------------------------------------------------------------
# Console d'administration
#
# Elle sert aussi de proxy vers l'API sur la MÊME origine (`/api`) :
# aucun CORS à ouvrir, et le cookie de session reste `SameSite`.
# ---------------------------------------------------------------
dashboard:
  enabled: true
  replicaCount: 2
  image:
    repository: ghcr.io/dd542/sentinel-dashboard
    tag: ""                   # vide = appVersion du Chart
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  # Image nginx non privilégiée : écoute sur 8080, tourne en UID 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}

# ---------------------------------------------------------------
# Configuration applicative (non secrète)
# ---------------------------------------------------------------
config:
  environment: production
  logFormat: json
  # Fail-closed : refuse de démarrer si la posture est incomplète
  # (persistance absente, clés par défaut, tokens non définis).
  strictMode: true
  rateLimitPerMinute: 120
  vaultTtlHours: 24
  # 0 = conservation illimitée du journal. À décider avec votre DPO.
  auditRetentionDays: 0
  purgeIntervalMinutes: 60
  streamNative: true
  # Fils de détection (travail CPU). 0 = nombre de cœurs vus par le
  # conteneur. À aligner sur `resources.limits.cpu`.
  detectionWorkers: 0
  ollamaBaseUrl: ""           # juge local L4 (optionnel)
  # Origines autorisées à appeler l'API depuis un navigateur, séparées
  # par des virgules. Inutile si la console est servie par ce chart
  # (elle relaie l'API sur la même origine) ; obligatoire en mode strict
  # dès que la console vit sur un autre domaine.
  # Le mode strict REFUSE de démarrer si cette valeur est vide : le
  # défaut n'autorise que localhost, la console serait injoignable.
  corsOrigins: "https://sentinel.example.com"

# ---------------------------------------------------------------
# Secrets
#
# En production, créez le Secret hors du chart (SOPS, Vault, External
# Secrets Operator…) et référencez-le par `existingSecret`. Les valeurs
# ci-dessous n'existent que pour les environnements de test : tout
# secret écrit dans un values.yaml finit dans un dépôt Git.
# ---------------------------------------------------------------
secrets:
  existingSecret: ""          # recommandé : nom d'un Secret déjà présent
  create: false               # true = le chart crée le Secret depuis `values`
  values:
    databaseUrl: ""
    vaultMasterKey: ""        # openssl rand -hex 32
    auditHmacKey: ""          # openssl rand -hex 32
    adminToken: ""
    dashboardToken: ""
    openaiApiKey: ""
    anthropicApiKey: ""
    groqApiKey: ""
    mistralApiKey: ""

# Clés attendues dans le Secret (à respecter si `existingSecret`).
secretKeys:
  databaseUrl: database_url
  vaultMasterKey: vault_master_key
  auditHmacKey: audit_hmac_key
  adminToken: admin_token
  dashboardToken: dashboard_token
  openaiApiKey: openai_api_key
  anthropicApiKey: anthropic_api_key
  groqApiKey: groq_api_key
  mistralApiKey: mistral_api_key

# ---------------------------------------------------------------
# Sécurité d'exécution
# ---------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 250m
    memory: 1Gi            # spaCy fr_core_news_lg tient en mémoire
  limits:
    cpu: "2"
    memory: 3Gi

# Le modèle de langue est chargé au premier scan : on laisse au pod le
# temps de démarrer avant de le déclarer en échec.
startupProbe:
  enabled: true
  failureThreshold: 30
  periodSeconds: 5
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 20
readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Un seul nom d'hôte pour l'API et la console. Les chemins listés dans
# `apiPaths` vont au backend, tout le reste à la console : le contrôleur
# retient le chemin le plus long, donc `/` ne capture pas `/v1`.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sentinel.example.com
      apiPaths:
        - /v1              # surface compatible OpenAI (chat, models, embeddings)
        - /gateway
        - /admin
        - /auth            # retour du fournisseur d'identité (OIDC)
        - /compliance
        - /corpus
        - /policy
        - /audit
        - /dashboard
        - /health
        - /metrics
        - /docs
        - /openapi.json
  tls: []

# Expose /metrics au Prometheus Operator (CRD ServiceMonitor requis).
serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# NetworkPolicy : seul le trafic entrant explicitement décrit est
# autorisé (la console est ajoutée automatiquement, sinon elle ne
# pourrait plus relayer l'API). Sortie ouverte — les fournisseurs d'IA
# sont sur Internet —, à restreindre selon votre politique.
#
# `ingressFrom` vide = AUCUNE source supplémentaire. Attention au piège
# de Kubernetes : une règle dont le champ `from` est vide autorise
# *toutes* les sources. Le chart n'émet donc pas de règle du tout dans
# ce cas, plutôt qu'une règle qui n'isolerait rien.
#
# Exemple : n'autoriser que le contrôleur d'ingress.
#   ingressFrom:
#     - namespaceSelector:
#         matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
networkPolicy:
  enabled: false
  ingressFrom: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
extraEnv: []

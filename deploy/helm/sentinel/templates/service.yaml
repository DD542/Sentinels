apiVersion: v1
kind: Service
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # Composant explicite : sans lui, ce Service enverrait aussi du trafic
  # aux pods de la console, qui portent les mêmes labels name/instance.
  selector:
    {{- include "sentinel.apiSelectorLabels" . | nindent 4 }}
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sentinel.serviceAccountName" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# SENTINEL n'appelle pas l'API Kubernetes : pas de jeton monté.
automountServiceAccountToken: false
{{- end }}

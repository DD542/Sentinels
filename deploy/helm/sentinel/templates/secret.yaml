{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- /*
  Secret créé depuis les valeurs — réservé aux environnements de test.
  En production, préférez `secrets.existingSecret` : tout secret placé
  dans un values.yaml finit versionné dans un dépôt Git.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $v := .Values.secrets.values }}
  {{- $k := .Values.secretKeys }}
  {{- with $v.databaseUrl }}
  {{ $k.databaseUrl }}: {{ . | quote }}
  {{- end }}
  {{- with $v.vaultMasterKey }}
  {{ $k.vaultMasterKey }}: {{ . | quote }}
  {{- end }}
  {{- with $v.auditHmacKey }}
  {{ $k.auditHmacKey }}: {{ . | quote }}
  {{- end }}
  {{- with $v.adminToken }}
  {{ $k.adminToken }}: {{ . | quote }}
  {{- end }}
  {{- with $v.dashboardToken }}
  {{ $k.dashboardToken }}: {{ . | quote }}
  {{- end }}
  {{- with $v.openaiApiKey }}
  {{ $k.openaiApiKey }}: {{ . | quote }}
  {{- end }}
  {{- with $v.anthropicApiKey }}
  {{ $k.anthropicApiKey }}: {{ . | quote }}
  {{- end }}
  {{- with $v.groqApiKey }}
  {{ $k.groqApiKey }}: {{ . | quote }}
  {{- end }}
  {{- with $v.mistralApiKey }}
  {{ $k.mistralApiKey }}: {{ . | quote }}
  {{- end }}
{{- end }}

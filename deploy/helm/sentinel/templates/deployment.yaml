apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.selectorLabels" . | nindent 8 }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.secrets.create }}
        # Redémarre les pods quand le Secret change.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "sentinel.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sentinel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: environment
              value: {{ .Values.config.environment | quote }}
            - name: log_format
              value: {{ .Values.config.logFormat | quote }}
            - name: strict_mode
              value: {{ .Values.config.strictMode | quote }}
            - name: rate_limit_per_minute
              value: {{ .Values.config.rateLimitPerMinute | quote }}
            - name: vault_ttl_hours
              value: {{ .Values.config.vaultTtlHours | quote }}
            - name: audit_retention_days
              value: {{ .Values.config.auditRetentionDays | quote }}
            - name: purge_interval_minutes
              value: {{ .Values.config.purgeIntervalMinutes | quote }}
            - name: stream_native
              value: {{ .Values.config.streamNative | quote }}
            - name: detection_workers
              value: {{ .Values.config.detectionWorkers | quote }}
            {{- with .Values.config.ollamaBaseUrl }}
            - name: ollama_base_url
              value: {{ . | quote }}
            {{- end }}
            # Le système de fichiers racine est en lecture seule : les
            # caches des bibliothèques doivent pointer vers un volume.
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/hf
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            {{- include "sentinel.secretEnv" (dict "name" "database_url" "key" .Values.secretKeys.databaseUrl "ctx" .) | nindent 12 }}
            {{- include "sentinel.secretEnv" (dict "name" "vault_master_key" "key" .Values.secretKeys.vaultMasterKey "ctx" .) | nindent 12 }}
            {{- include "sentinel.secretEnv" (dict "name" "audit_hmac_key" "key" .Values.secretKeys.auditHmacKey "ctx" .) | nindent 12 }}
            {{- include "sentinel.secretEnv" (dict "name" "admin_token" "key" .Values.secretKeys.adminToken "ctx" .) | nindent 12 }}
            {{- include "sentinel.secretEnv" (dict "name" "dashboard_token" "key" .Values.secretKeys.dashboardToken "ctx" .) | nindent 12 }}
            {{- include "sentinel.secretEnv" (dict "name" "openai_api_key" "key" .Values.secretKeys.openaiApiKey "ctx" .) | nindent 12 }}
            {{- include "sentinel.secretEnv" (dict "name" "anthropic_api_key" "key" .Values.secretKeys.anthropicApiKey "ctx" .) | nindent 12 }}
            {{- include "sentinel.secretEnv" (dict "name" "groq_api_key" "key" .Values.secretKeys.groqApiKey "ctx" .) | nindent 12 }}
            {{- include "sentinel.secretEnv" (dict "name" "mistral_api_key" "key" .Values.secretKeys.mistralApiKey "ctx" .) | nindent 12 }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

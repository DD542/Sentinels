[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
detection = ["presidio-analyzer>=2.2", "spacy>=3.7", "pgvector>=0.3"]
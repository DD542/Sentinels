name: SENTINEL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

      - name: Run benchmark
        working-directory: backend
        run: python tests/benchmark.py --json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check syntax
        working-directory: backend
        run: |
          pip install -e .
          python -m py_compile app/main.py
          python -m py_compile app/config.py
          python -m py_compile app/detection/engine.py
          python -m py_compile app/detection/l0_normalize.py
          python -m py_compile app/detection/l1_deterministic.py
          python -m py_compile app/vault/fpe.py
          python -m py_compile app/audit/chain.py
          python -m py_compile app/auth.py
          python -m py_compile app/db.py
          echo "All modules compile successfully"

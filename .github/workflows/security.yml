name: SENTINEL — chaîne d'approvisionnement

# Un outil de sécurité doit être exemplaire sur sa propre chaîne
# d'approvisionnement : dépendances auditées, image scannée, inventaire
# (SBOM) publié pour chaque version.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Les CVE apparaissent après la fusion : on rescanne chaque lundi.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    name: Audit des dépendances Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Auditer les dépendances déclarées
        working-directory: backend
        # `-e .` installe le projet et ses dépendances, que pip-audit
        # inspecte ensuite dans l'environnement résolu.
        run: |
          pip install -e .
          pip-audit --strict --desc

  image:
    name: Scan de l'image et SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # dépôt du rapport SARIF
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t sentinel:ci ./backend

      # NOTE : `@master` suit la branche de l'action. Pour un déploiement
      # d'entreprise, épinglez un SHA de commit.
      - name: Scanner l'image (rapport SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sentinel:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Publier le rapport dans l'onglet Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Échouer sur une vulnérabilité corrigeable HIGH ou CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sentinel:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Générer le SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: sentinel:ci
          format: cyclonedx-json
          output-file: sentinel-sbom.cdx.json
          upload-artifact: false

      - name: Publier le SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sentinel-sbom.cdx.json
          retention-days: 90

  helm:
    name: Validation du chart Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint deploy/helm/sentinel

      - name: Rendu avec les valeurs par défaut
        run: helm template sentinel deploy/helm/sentinel > /tmp/rendu-defaut.yaml

      - name: Rendu avec toutes les options activées
        run: |
          helm template sentinel deploy/helm/sentinel \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true \
            --set secrets.create=true \
            --set secrets.values.auditHmacKey=test \
            > /tmp/rendu-complet.yaml

      - name: Rendu sans la console
        run: |
          helm template sentinel deploy/helm/sentinel \
            --set dashboard.enabled=false \
            --set ingress.enabled=true \
            > /tmp/rendu-sans-console.yaml

      - name: Rendu avec une NetworkPolicy restrictive
        run: |
          helm template sentinel deploy/helm/sentinel \
            --set networkPolicy.enabled=true \
            --set 'networkPolicy.ingressFrom[0].namespaceSelector.matchLabels.kubernetes\.io/metadata\.name=ingress-nginx' \
            > /tmp/rendu-netpol.yaml

      # Deux validations complémentaires, et aucune des deux ne remplace
      # l'autre :
      #
      #   * kubeconform vérifie la CONFORMITÉ AU SCHÉMA Kubernetes — types
      #     des champs, champs obligatoires, et en mode strict les champs
      #     inconnus (une faute de frappe comme `replicaCount` au lieu de
      #     `replicas` s'appliquerait sans erreur et serait simplement
      #     ignorée par le cluster) ;
      #   * valider_rendu.py vérifie la COHÉRENCE DU CHART — un manifeste
      #     peut être parfaitement conforme au schéma et pointer vers un
      #     Service qui n'existe pas.
      #
      # Les deux travaillent hors ligne. Elles remplacent
      # `kubectl apply --dry-run=client`, qui contacte le serveur d'API
      # pour résoudre les types : sans cluster — et un runner n'en a pas —
      # cette commande échoue toujours, y compris avec `--validate=false`.
      # Elle ne validait donc rien.
      - name: Installer kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          /tmp/kubeconform -v

      - name: Conformité au schéma Kubernetes
        # Le catalogue de CRD couvre le `ServiceMonitor` de l'opérateur
        # Prometheus, absent du schéma standard. Sans lui il serait
        # « skipped » — c'est-à-dire non validé, en silence.
        run: |
          /tmp/kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendu-defaut.yaml \
            /tmp/rendu-complet.yaml \
            /tmp/rendu-sans-console.yaml \
            /tmp/rendu-netpol.yaml

      - name: Cohérence du chart
        run: |
          pip install pyyaml
          python3 deploy/helm/valider_rendu.py \
            /tmp/rendu-defaut.yaml \
            /tmp/rendu-complet.yaml \
            /tmp/rendu-sans-console.yaml \
            /tmp/rendu-netpol.yaml

      - name: La console doit être servie sur le même hôte que l'API
        run: |
          grep -q "sentinel-dashboard" /tmp/rendu-complet.yaml
          # Sans console, l'ingress doit retomber entièrement sur l'API.
          ! grep -q "\-dashboard" /tmp/rendu-sans-console.yaml
          echo "Routage de l'ingress coherent dans les deux modes"
